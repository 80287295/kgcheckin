name: main

# 恢复 GitHub 原生 schedule 定时触发（每天 UTC 17:00 ≈ 北京时间次日 01:00）
# 说明：GitHub 的「60 天无活动禁用 scheduled workflow」仅针对公共仓库且仓库完全无活动；
#       本仓库每天签到 + heartbeat 提交，仓库持续有 commit 活动，schedule 不会被禁用。
#       因此无需外部 cron 服务绕行，改为原生 schedule 更稳定。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
  # 保留 push 触发，方便手动改配置后立即验证
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules in api directory
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}

      - name: 签到
        run: npm run main
        env:
          USERINFO: ${{ secrets.USERINFO }}

      # 保活：每次运行都提交一个时间戳，避免仓库无活动导致工作流被禁用
      - name: 心跳保活
        if: always()
        run: |
          mkdir -p .heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .heartbeat/last-run.txt
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"
